<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time</title>
    <base href="./" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Time.styles.css" rel="stylesheet" />
    <!-- Uncomment to turn the Android screensaver into the skin benchmark: the
         dream loads a bare URL and takes no input, so this tag is the only way
         to enable it there. The content is read exactly as a query string.
         Remove it again to get the clock back. Ignored in a browser, where
         ?bench=1 does the same job.
    <meta name="bench" content="bench=1&measure=60000&rounds=6" />
    -->
  </head>

  <body>
    <div id="app">
      <svg class="loading-progress">
        <circle r="40%" cx="50%" cy="50%" />
        <circle r="40%" cx="50%" cy="50%" />
      </svg>
      <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
      An unhandled error has occurred.
      <a href="" class="reload">Reload</a>
      <a class="dismiss">🗙</a>
    </div>
    <script src="js/animationInterop.js"></script>
    <script src="js/bench.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
  </body>
</html>
